name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so CI doesn't queue up stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileDebugKotlin compileReleaseKotlin

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Release build (AAR + APK, unsigned)
        run: ./gradlew :nfc-locator-core:assembleRelease :app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  publish-dry-run:
    # Verifies the Maven publication (POM, sources jar, Dokka javadoc jar) still assembles
    # correctly on every PR, without ever touching real credentials or a remote repository -
    # `publishToMavenLocal` needs no secrets, unlike the real publish workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to local Maven repo (verification only)
        # Overrides GROUP for this dry run only, so a CI run never writes into the real
        # published namespace - this job only proves the publication (POM, sources jar, Dokka
        # javadoc jar) still assembles, it never touches a remote repository or reads real
        # credentials.
        run: ./gradlew :nfc-locator-core:publishToMavenLocal -PGROUP=io.github.ci-dry-run
